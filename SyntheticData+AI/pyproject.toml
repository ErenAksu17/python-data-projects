[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vfactory"
version = "2.0.0"
description = "Synthetic vibration simulation and autoencoder anomaly detection for rotating machinery"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eren Aksu" }]
keywords = ["anomaly-detection", "vibration", "predictive-maintenance", "autoencoder"]

# Serving only. Training pulls in PyTorch separately (requirements-train.txt)
# so the deployed container never installs a deep-learning stack.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[project.optional-dependencies]
train = ["torch>=2.2", "scikit-learn>=1.4"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:vfactory.*"]

[tool.ruff]
line-length = 96
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
